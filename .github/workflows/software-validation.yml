name: software-validation

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy opencv-python-headless pillow
      - name: Python syntax
        run: python3 -m py_compile $(find scripts tests -name '*.py' -type f)
      - name: Offline B4/B5 tests
        run: |
          python3 -m unittest discover -s tests/b4_prep -p 'test_*.py'
          python3 -m unittest discover -s tests -p 'test_b5_h1_preflight.py'
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD
      - name: Publication safety scan
        run: python3 scripts/repository_safety_scan.py --root .
      - name: CMake and CTest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --target \
            main_core main_control main_motor main_sim main_web_control main_web_sim \
            test_collision test_kinematics test_motion_plan test_workflow \
            test_k0_prepare_sim test_readiness --parallel 2
          ctest --test-dir build --output-on-failure
